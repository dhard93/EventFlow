services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: EventFlowDB
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/load_data.sql:/docker-entrypoint-initdb.d/02-load-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: EventFlowDB
      DB_USER: demo
      DB_PASSWORD: demo-password
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: